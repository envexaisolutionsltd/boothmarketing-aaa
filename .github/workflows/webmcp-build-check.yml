name: WebMCP Build Check

on:
  push:
    branches: [main, webmcp-production-ready, webmcp-resilience]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: WebMCP contract checks
        run: node scripts/webmcp-contract.mjs
      - name: Production build and type check
        env:
          NEXT_PUBLIC_WEBMCP_ENABLED: 'true'
        run: npm run build
