name: Portfolio Screenshots

on:
  push:
    branches: [main]
    paths:
      - 'scripts/capture-portfolio.mjs'
      - '.github/workflows/portfolio-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture public portfolio sites
        run: node scripts/capture-portfolio.mjs

      - name: Commit local screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/work/northstead.png public/work/purple-door.png public/work/graft-haus.png
          if git diff --cached --quiet; then
            echo "Portfolio screenshots are already current"
          else
            git commit -m "Refresh local portfolio screenshots"
            git push
          fi
