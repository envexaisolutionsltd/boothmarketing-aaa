name: Finalize Homepage Previews

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-homepage-previews.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace external preview service with local assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          old = "const capture=(url:string)=>`https://image.thum.io/get/width/1200/crop/760/noanimate/${url}`"
          new = "const capture=(url:string)=>url.includes('northstead')?'/work/northstead.png':url.includes('purple-door')?'/work/purple-door.png':'/work/graft-haus.png'"
          if old not in s:
              raise SystemExit('Expected external capture helper was not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit final homepage preview change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Use local portfolio screenshots on homepage"
          git push
